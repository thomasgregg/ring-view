name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements-blueprint.txt
      - run: python tests/notification_timestamp_test.py
      - run: npm run build
      - name: Prepare release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish bundle
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ring-view.js
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
