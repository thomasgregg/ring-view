name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements-blueprint.txt
      - run: python tests/notification_timestamp_test.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=desktop
      - run: npm run build
      - uses: hacs/action@main
        with:
          category: plugin
