type: custom:ring-view

recording_entity: camera.front_door
live_entity: camera.front_door_live_view
name: Entrance

default_mode: last_recording
live_muted: true
two_way_audio: true
doorbell_entity: event.front_door_ding

# Optional door access
door_entity: lock.front_door
door_contact_entity: binary_sensor.front_door_contact
door_action: unlock
door_control_visibility: live_only
door_hold_to_activate: true

# Optional beta: put the camera controls directly on the dashboard.
# Existing cards default to open_viewer and remain unchanged.
dashboard_behavior: interactive
dashboard_start: on_demand
dashboard_live_muted: true
door_control_on_dashboard: false

show_name: false
aspect_ratio: "16:9"
fit_mode: cover

grid_options:
  columns: 12
  rows: 3
