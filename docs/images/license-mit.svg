<svg xmlns="http://www.w3.org/2000/svg" width="78" height="20" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <mask id="rounded">
    <rect width="78" height="20" rx="3" fill="#fff"/>
  </mask>
  <g mask="url(#rounded)">
    <rect width="47" height="20" fill="#555"/>
    <rect x="47" width="31" height="20" fill="#dfb317"/>
    <rect width="78" height="20" fill="url(#shine)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="23.5" y="15" fill="#010101" fill-opacity=".3">license</text>
    <text x="23.5" y="14">license</text>
    <text x="62.5" y="15" fill="#010101" fill-opacity=".3">MIT</text>
    <text x="62.5" y="14">MIT</text>
  </g>
</svg>
